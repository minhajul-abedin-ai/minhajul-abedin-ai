name: Portfolio website • test and publish

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/portfolio-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/portfolio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  test:
    name: Validate static portfolio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML, site logic and public-only repository links
        run: node --test tests/*.test.mjs
      - name: Check website JavaScript syntax
        run: node --check site/app.mjs

  deploy:
    name: Deploy portfolio to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload portfolio files
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
